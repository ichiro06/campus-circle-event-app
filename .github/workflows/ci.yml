name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: Expo mobile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run check

  backend-quality:
    name: FastAPI lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/requirements.lock
            backend/requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - run: python generate_openapi.py --check openapi.json
      - run: alembic history

  backend:
    name: FastAPI and PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: docker compose -f backend/compose.yaml config --quiet
      - name: Start API and database
        run: docker compose -f backend/compose.yaml up -d --build
      - name: Wait for API
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8000/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f backend/compose.yaml logs
          exit 1
      - name: Verify formal product migration
        run: |
          docker compose -f backend/compose.yaml exec -T api alembic upgrade head
          docker compose -f backend/compose.yaml exec -T api alembic downgrade base
          docker compose -f backend/compose.yaml exec -T api alembic upgrade head
          test "$(docker compose -f backend/compose.yaml exec -T db psql -U campus -d campus_circle_app -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'app_private'")" = "27"
      - name: Check read endpoints
        run: |
          curl --fail --silent http://localhost:8000/api/circles > /dev/null
          curl --fail --silent http://localhost:8000/api/events > /dev/null
      - name: Stop API and database
        if: always()
        run: docker compose -f backend/compose.yaml down

  next-technical-verification:
    name: Next.js technical verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
